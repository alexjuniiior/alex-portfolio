# Portfolio v2: a plain static site (no build step). Netlify publishes /public as is.
[build]
  publish = "public"
  command = ""

# Fonts and the animation libraries never change name-for-name: cache for a year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and video keep their names when replaced, so browsers re-check them
# (cheap 304s) instead of keeping an old copy
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
